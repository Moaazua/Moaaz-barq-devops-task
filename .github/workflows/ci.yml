name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run app-only unit tests (fakes, do not prove environment health)
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate Compose syntax
        run: docker compose -p barq-assessment config -q

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Wait for /ready (bounded)
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/ready > /dev/null; then
              echo "Ready after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i/15: not ready yet, waiting..."
            sleep 2
          done
          echo "Environment did not become ready in time" >&2
          docker compose -p barq-assessment logs --no-color
          exit 1

      - name: Run validate.py
        run: python3 validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p barq-assessment down
